name: SongMintedAI
options:
  bundleIdPrefix: com.songminted
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SongMintedAI:
    type: application
    platform: iOS
    sources:
      - SongMintedAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.songminted.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record a melody, hum, or instrument to base your song on."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "R9498NMR73"   # Franco Capone (Apple Developer team)
